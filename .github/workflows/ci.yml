name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  # -------------------------------------------------------
  # Job 1: バックエンド（APIサーバー）テスト
  # -------------------------------------------------------
  test-backend:
    name: Backend テスト (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run backend tests
        run: mvn -pl backend -am test

  # -------------------------------------------------------
  # Job 2: バッチサーバーテスト（H2 インメモリ DB 使用）
  # -------------------------------------------------------
  test-batch:
    name: Batch テスト (Java 17)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run batch tests
        run: mvn -pl batch -am test

  # -------------------------------------------------------
  # Job 3: フロントエンド Lint
  # -------------------------------------------------------
  lint-frontend:
    name: Frontend Lint (Node.js 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run ESLint
        working-directory: frontend
        run: npm run lint
