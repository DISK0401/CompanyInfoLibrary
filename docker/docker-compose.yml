version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: companylib-db
    environment:
      POSTGRES_DB: companylib
      POSTGRES_USER: companylib
      POSTGRES_PASSWORD: companylib
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companylib"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: companylib-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/companylib
      DB_USERNAME: companylib
      DB_PASSWORD: companylib
      JPA_DDL_AUTO: validate
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/companies || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  batch:
    build:
      context: ..
      dockerfile: docker/Dockerfile.batch
    container_name: companylib-batch
    environment:
      DB_URL: jdbc:postgresql://db:5432/companylib
      DB_USERNAME: companylib
      DB_PASSWORD: companylib
      JPA_DDL_AUTO: validate
      GBIZINFO_API_TOKEN: ${GBIZINFO_API_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  # ── 初回データ投入ジョブ（1回限り実行） ───────────────────────────────────────
  # 使用方法:
  #   GBIZINFO_API_TOKEN=<トークン> docker compose run --rm batch_initial_load
  # オプション（ローカルに ZIP がある場合はダウンロードをスキップ）:
  #   GBIZINFO_DOWNLOAD_DIR=/path/to/zips docker compose run --rm batch_initial_load
  batch_initial_load:
    build:
      context: ..
      dockerfile: docker/Dockerfile.batch
    container_name: companylib-batch-initial-load
    environment:
      DB_URL: jdbc:postgresql://db:5432/companylib
      DB_USERNAME: companylib
      DB_PASSWORD: companylib
      JPA_DDL_AUTO: validate
      GBIZINFO_API_TOKEN: ${GBIZINFO_API_TOKEN:-}
      GBIZINFO_DOWNLOAD_DIR: ${GBIZINFO_DOWNLOAD_DIR:-/data/gbizinfo/downloads}
      GBIZINFO_DOWNLOAD_API_URL: ${GBIZINFO_DOWNLOAD_API_URL:-https://info.gbiz.go.jp/hojin/Download}
      SPRING_BATCH_JOB_ENABLED: "true"
      SPRING_BATCH_JOB_NAME: gbizInfoInitialLoadJob
      GBIZINFO_PROXY_HOST: ${GBIZINFO_PROXY_HOST:-}
      GBIZINFO_PROXY_PORT: ${GBIZINFO_PROXY_PORT:-0}
      GBIZINFO_PROXY_USER: ${GBIZINFO_PROXY_USER:-}
      GBIZINFO_PROXY_PASSWORD: ${GBIZINFO_PROXY_PASSWORD:-}
      GBIZINFO_SSL_VERIFY: ${GBIZINFO_SSL_VERIFY:-true}
    volumes:
      - gbizinfo_downloads:/data/gbizinfo/downloads
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - initial-load

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: companylib-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  gbizinfo_downloads:
