spring:
  application:
    name: company-info-library-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/companylib}
    username: ${DB_USERNAME:companylib}
    password: ${DB_PASSWORD:companylib}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    table: flyway_schema_history_backend

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # ORDER BY で NULL を常に末尾に配置する（DESC NULLS LAST / ASC NULLS LAST）
        # Hibernate 6.x の正式プロパティ名
        default_null_ordering: last

  web:
    resources:
      add-mappings: false

  mvc:
    throw-exception-if-no-handler-found: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.companylib: ${LOG_LEVEL:INFO}
