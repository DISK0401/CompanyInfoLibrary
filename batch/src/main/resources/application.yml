spring:
  application:
    name: company-info-library-batch

  # バッチはWebサーバー不要（spring-boot-starter-web は RestTemplate 用に含んでいるが
  # HTTPサーバーとして起動する必要はない）
  main:
    web-application-type: none

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/companylib}
    username: ${DB_USERNAME:companylib}
    password: ${DB_PASSWORD:companylib}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  batch:
    job:
      # 起動時に自動でジョブを実行しない（明示的に実行する）
      # 環境変数 SPRING_BATCH_JOB_ENABLED=true で上書き可能
      enabled: ${SPRING_BATCH_JOB_ENABLED:false}
      # 実行するジョブ名（環境変数 SPRING_BATCH_JOB_NAME で指定）
      name: ${SPRING_BATCH_JOB_NAME:}
    jdbc:
      initialize-schema: always

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_batch

gbizinfo:
  api:
    base-url: ${GBIZINFO_API_BASE_URL:https://api.info.gbiz.go.jp/hojin/v2}
    token: ${GBIZINFO_API_TOKEN:}
  download:
    api-url: ${GBIZINFO_DOWNLOAD_API_URL:https://info.gbiz.go.jp/hojin/Download}
    dir: ${GBIZINFO_DOWNLOAD_DIR:/tmp/gbizinfo/downloads}
  # プロキシ設定（社内プロキシ経由が必要な場合に設定）
  proxy:
    host: ${GBIZINFO_PROXY_HOST:}
    port: ${GBIZINFO_PROXY_PORT:0}
    user: ${GBIZINFO_PROXY_USER:}
    password: ${GBIZINFO_PROXY_PASSWORD:}
  # SSL 証明書検証（社内プロキシで証明書エラーが出る場合は false に設定）
  ssl:
    verify: ${GBIZINFO_SSL_VERIFY:true}

scraping:
  rate-limit:
    # 同一ドメインへのアクセス間隔（ミリ秒）
    interval-ms: ${SCRAPING_INTERVAL_MS:2000}
  user-agent: ${SCRAPING_USER_AGENT:CompanyInfoLibrary/1.0 (+contact@example.com)}

logging:
  level:
    com.companylib: ${LOG_LEVEL:INFO}
    org.springframework.batch: ${BATCH_LOG_LEVEL:INFO}
